[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldtrain"
version = "0.2.0"
description = "Shallow logging for deep-learning runs into human-readable files, with a browser viewer."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ email = "luis.denninger@gmail.com" }]
# 3.12: console filters return a copied LogRecord, which logging honours from 3.12 on
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "omegaconf",
    "opencv-python",
    "pyyaml",
    "torch",
    "typing_extensions",
]

[project.optional-dependencies]
# `python -m ldtrain.viewer <root_dir>` or `ldtrain-viewer`; training code never imports it
viewer = [
    "fastapi",
    "uvicorn",
]
dev = [
    "ldtrain[viewer]",
    "httpx",
    "pytest",
    "ruff",
]

[project.scripts]
ldtrain-viewer = "ldtrain.viewer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ldtrain"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["ldtrain/tests"]
