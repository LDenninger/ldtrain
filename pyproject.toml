[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ldtrain"
version = "0.2.3"
description = "Shallow logging for deep-learning runs into human-readable files, with a browser viewer."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Luis Denninger", email = "luis.denninger@gmail.com" }]
keywords = ["deep-learning", "pytorch", "experiment-tracking", "logging", "metrics", "visualization", "distributed-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Logging",
]
# 3.12: console filters return a copied LogRecord, which logging honours from 3.12 on
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "omegaconf",
    "opencv-python",
    "pyyaml",
    "torch",
    "typing_extensions",
]

[project.optional-dependencies]
# `python -m ldtrain.viewer <root_dir>` or `ldtrain-viewer`; training code never imports it
viewer = [
    "fastapi",
    "uvicorn",
]
dev = [
    "ldtrain[viewer]",
    "httpx",
    "pytest",
    "pytest-cov",
    "pytest-playwright",
    "ruff",
]

# `uv sync` installs the package with the viewer and the test tools; pip users take `[dev]` above
[dependency-groups]
dev = [
    "ldtrain[viewer]",
    "httpx",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-playwright",
    "ruff",
]

[project.urls]
Repository = "https://github.com/LDenninger/ldtrain"
Issues = "https://github.com/LDenninger/ldtrain/issues"
Releases = "https://github.com/LDenninger/ldtrain/releases"

[project.scripts]
ldtrain-viewer = "ldtrain.viewer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ldtrain"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["ldtrain/tests"]
markers = [
    "browser: drives the viewer in headless Chromium, needs `playwright install chromium`",
    "multiprocess: spawns two ranks and a gloo process group",
]
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning",
]

[tool.coverage.run]
omit = ["ldtrain/tests/*"]
