name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # CPU wheels keep the install under a minute; the lock file pins CUDA torch for dev machines
      - name: Install
        run: |
          uv venv --clear
          uv pip install --torch-backend=cpu -e ".[dev]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Lint
        run: uv run --no-sync ruff check ldtrain

      - name: Test
        run: uv run --no-sync pytest --cov=ldtrain --cov-report=term
