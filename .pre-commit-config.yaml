# Install once with `uv run pre-commit install`: lint and hygiene on commit, the test suite on push.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite, on push)
        entry: uv run --no-sync pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
